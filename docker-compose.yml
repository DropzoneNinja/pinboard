services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pinboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinboard} -d ${POSTGRES_DB:-pinboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # `image:` pulls the GitHub Actions-built image from GHCR (used by `docker compose pull && up -d`).
  # `build:` lets local development rebuild the same tag from source (`docker compose up --build`).
  backend:
    image: ghcr.io/dropzoneninja/pinboard-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pinboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pinboard}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      RECYCLE_BIN_RETENTION_DAYS: ${RECYCLE_BIN_RETENTION_DAYS:-30}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      SEED_USER1_USERNAME: ${SEED_USER1_USERNAME}
      SEED_USER1_PASSWORD: ${SEED_USER1_PASSWORD}
      SEED_USER1_DISPLAY_NAME: ${SEED_USER1_DISPLAY_NAME}
      SEED_USER1_COLOUR: ${SEED_USER1_COLOUR}
      SEED_USER2_USERNAME: ${SEED_USER2_USERNAME}
      SEED_USER2_PASSWORD: ${SEED_USER2_PASSWORD}
      SEED_USER2_DISPLAY_NAME: ${SEED_USER2_DISPLAY_NAME}
      SEED_USER2_COLOUR: ${SEED_USER2_COLOUR}
    volumes:
      - uploads_data:/data/uploads
      - ${BACKUP_HOST_DIR:-backups_data}:/data/backups
    networks:
      - internal

  frontend:
    image: ghcr.io/dropzoneninja/pinboard-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal

volumes:
  postgres_data:
  uploads_data:
  # Only actually created/used when BACKUP_HOST_DIR is left unset — see the backend service's
  # volume mount above, which substitutes BACKUP_HOST_DIR (an absolute host path) in its place
  # when that variable is set, bind-mounting that directory instead of this managed volume.
  backups_data:

networks:
  internal:

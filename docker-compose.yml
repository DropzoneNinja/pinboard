services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pinboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinboard} -d ${POSTGRES_DB:-pinboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # `image:` pulls the GitHub Actions-built image from GHCR (used by `docker compose pull && up -d`).
  # `build:` lets local development rebuild the same tag from source (`docker compose up --build`).
  backend:
    image: ghcr.io/dropzoneninja/pinboard-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
    volumes:
      - uploads_data:/data/uploads
    networks:
      - internal

  frontend:
    image: ghcr.io/dropzoneninja/pinboard-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
